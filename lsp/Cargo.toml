[package]
name = "todo-highlight-lsp"
version = "0.2.1"
edition = "2021"

[[bin]]
name = "todo-highlight-lsp"
path = "src/main.rs"

[dependencies]
lsp-server = "=0.7.9"
lsp-types = "0.95"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
url = "=2.5.8"

[dev-dependencies]
serde_json = "1.0"
crossbeam-channel = "0.5"
