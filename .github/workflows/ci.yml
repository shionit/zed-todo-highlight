name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-wasip1
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Tests (unit + integration)
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy -p todo-highlight-lsp -- -D warnings

      - name: Check extension (wasm32-wasip1)
        run: cargo check -p todo-highlight-extension --target wasm32-wasip1
