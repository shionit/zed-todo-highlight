[workspace]
members = ["extension", "lsp"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Pin url to avoid edition2024 transitive deps (idna_adapter)
[patch.crates-io]

[profile.release]
opt-level    = "z"  # optimise for binary size (LSP binary is downloaded by users)
lto          = true
codegen-units = 1
strip        = true
